; Vale config — prose linting for the K8sManager spec repository.
;
; Run via pnpm:
;   pnpm lint:prose
;
; CI / pre-commit: invoked from lefthook.yml.

StylesPath = .vale/styles
MinAlertLevel = error
Packages = write-good

[*.md]
BasedOnStyles = Vale, write-good

write-good.E-Prime = NO
write-good.Passive = warning
write-good.ThereIs = warning
write-good.TooWordy = warning
write-good.Weasel = warning

Vale.Spelling = NO
Vale.Terms = NO
